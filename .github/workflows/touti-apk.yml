name: Touti Score APK

on:
  push:
    paths:
      - "touti/**"
      - "gradle/**"
      - ".github/workflows/touti-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew -p touti testDebugUnitTest

      - name: Lint
        run: ./gradlew -p touti lintDebug

      - name: Assemble debug APK
        run: |
          ./gradlew -p touti assembleDebug
          cp touti/app/build/outputs/apk/debug/*.apk touti-score.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: touti-score
          path: touti-score.apk

      # A single, always-current release so the APK can be downloaded straight from a phone.
      - name: Publish "touti-latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete touti-latest --cleanup-tag --yes || true
          gh release create touti-latest touti-score.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Touti Score (dernière version)" \
            --notes "APK de l'appli de score du Touti, construit depuis ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
